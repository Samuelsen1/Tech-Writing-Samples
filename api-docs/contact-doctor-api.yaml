openapi: 3.0.0

info:
  title: Contact Doctor API
  description: A simple API to search for health professionals nearby and connect with them.
  version: 1.0.0

servers:
  - url: https://welth.de
    description: Production server

paths:
  /contact-doctor:
    get:
      summary: Search for health professionals
      description: Returns results based on user condition and location.
      parameters:
        - name: specialty
          in: query
          description: Specialty of the health professional (e.g., Rheumatologist)
          required: false
          schema:
            type: string
        - name: location
          in: query
          description: User’s location (e.g., Hessen)
          required: false
          schema:
            type: string
        - name: condition
          in: query
          description: (Optional) Medical condition of the user. If not provided, the default saved condition will be used.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Search completed successfully
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: Server Error
